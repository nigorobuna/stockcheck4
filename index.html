<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>QRコード登録フォーム</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h2>QRコードを読み取るフォーム</h2>
  <form id="reportForm">
    <label>品目 (QRコードで自動入力)
      <input type="text" name="item" id="item" required>
    </label>

    <label>使用者
      <input type="text" name="user" required>
    </label>

    <label>使用日
      <input type="date" name="date">
    </label>

    <label>個数
      <input type="number" name="count" value="1" min="1">
    </label>

    <button type="submit">送信</button>
  </form>

  <button id="start-camera">QRコードを読み込む</button>

  <script>
    document.getElementById('start-camera').addEventListener('click', function() {
      // QRコード読み取り用のウィンドウを開く
      const qrWindow = window.open('', '', 'width=400,height=400');
      qrWindow.document.write('<h2>QRコードをスキャンしてください</h2>');
      qrWindow.document.write('<video id="video" width="100%" height="auto" style="border: 1px solid #ccc;"></video>');
      qrWindow.document.write('<canvas id="canvas" style="display: none;"></canvas>');
      qrWindow.document.write('<script src="https://unpkg.com/jsqr/dist/jsQR.js"></script>');

      qrWindow.document.write(`
        <script>
          const video = document.getElementById('video');
          const canvas = document.getElementById('canvas');
          
          navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(function(stream) {
              video.srcObject = stream;
              video.play();
              requestAnimationFrame(scanQRCode);
            }).catch(function(err) {
              alert("カメラにアクセスできません: " + err);
            });

          function scanQRCode() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
              canvas.height = video.videoHeight;
              canvas.width = video.videoWidth;

              const context = canvas.getContext('2d');
              context.drawImage(video, 0, 0, canvas.width, canvas.height);

              const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
              const qrCode = jsQR(imageData.data, canvas.width, canvas.height);

              if (qrCode) {
                const qrText = qrCode.data;
                window.opener.document.getElementById("item").value = qrText;
                window.close();
              }
            }

            requestAnimationFrame(scanQRCode);
          }
        </script>
      `);
    });
  </script>
</body>
</html>
